# Journeyman policy gate. Actor and reflection must pass every MCP call through this file.
mcp:
  url: https://api.githubcopilot.com/mcp/readonly
  write_url: https://api.githubcopilot.com/mcp/
  toolsets:
    - context
    - repos
    - issues
    - labels
    - pull_requests

allow:
  tools:
    - get_me
    - search_repositories
    - list_label
    - get_label
    - get_file_contents
    - get_repository_tree
    - issue_read
    - list_issues
    - search_issues
    - list_pull_requests
    - pull_request_read
    - search_pull_requests
    - search_code
  file_paths:
    - CODEOWNERS
    - .github/CODEOWNERS
    - CONTRIBUTING.md
    - src/**

deny:
  tools:
    - issue_write
    - sub_issue_write
    - label_write
    - add_issue_comment
    - create_pull_request
    - update_pull_request
    - update_pull_request_branch
    - pull_request_review_write
    - merge_pull_request
    - create_branch
    - create_or_update_file
    - create_repository
    - delete_file
    - delete_repository
    - fork_repository
    - push_files
    - actions_get
    - actions_list
    - actions_run_trigger
    - get_secret_scanning_alert
    - list_secret_scanning_alerts
    - get_code_scanning_alert
    - list_code_scanning_alerts
  name_patterns:
    - "*write*"
    - "create_*"
    - "update_*"
    - "delete_*"
    - "push_*"
    - "merge_*"
    - "fork_*"
    - "*secret*"
    - "*workflow*"
    - "actions_*"
    - "*deploy*"
    - "*admin*"
